# ros2 run ros_gz_bridge parameter_bridge --ros-args -p config_file:=bridge_config.yaml

# Steering Joints (Position Control)
- ros_topic_name: "wheel/frontleft/steering/pos"
  gz_topic_name: "wheel/frontleft/steering/pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "ignition.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "wheel/backleft/steering/pos"
  gz_topic_name: "wheel/backleft/steering/pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "ignition.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "wheel/frontright/steering/pos"
  gz_topic_name: "wheel/frontright/steering/pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "ignition.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "wheel/backright/steering/pos"
  gz_topic_name: "wheel/backright/steering/pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "ignition.msgs.Double"
  direction: ROS_TO_GZ

# Traction Joints (Velocity Control)
- ros_topic_name: "wheel/frontleft/traction/vel"
  gz_topic_name: "wheel/frontleft/traction/vel"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "ignition.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "wheel/backleft/traction/vel"
  gz_topic_name: "wheel/backleft/traction/vel"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "ignition.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "wheel/frontright/traction/vel"
  gz_topic_name: "wheel/frontright/traction/vel"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "ignition.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "wheel/backright/traction/vel"
  gz_topic_name: "wheel/backright/traction/vel"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "ignition.msgs.Double"
  direction: ROS_TO_GZ

# Joint States (Feedback)
- ros_topic_name: "joint_states"
  gz_topic_name: "/world/default/model/terby/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "ignition.msgs.Model"
  direction: GZ_TO_ROS